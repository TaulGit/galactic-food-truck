<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101a34" />
    <title>星厨餐车</title>
    <script>
      // star-letter dev serves the repository root as a plain static site. If
      // that server cannot transform the TypeScript module, hand off to the
      // already-built directory entry instead of leaving a blank iframe. The
      // published directory entry is uploaded at the object root, so this
      // fallback must never run on the CDN-hosted game.
      (() => {
        const isLocalDevServer = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname)
        if (!isLocalDevServer) return

        const redirectToBuiltEntry = () => {
          const app = document.querySelector('#app')
          const isBuiltEntry = window.location.pathname.includes('/dist/')
          if (isBuiltEntry) return
          if (app && app.childElementCount === 0) {
            window.location.replace('./dist/index.html')
            return
          }
          window.setTimeout(redirectToBuiltEntry, 250)
        }
        window.setTimeout(redirectToBuiltEntry, 900)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Star-letter only supports the platform IIFE. The host injects gameId at runtime. -->
    <script src="https://gz-vchar-pub.nosdn.127.net/star-letter/game-sdk/v2/sdk.iife.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
